name: Softwall Business OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Security audit
        run: pnpm security:audit

  cd-staging:
    name: CD Staging
    needs: [verify, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build deployment artifact
        run: pnpm build
      - name: Validate staging deployment configuration
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "DEPLOY_COMMAND is not configured for the staging environment."
            exit 1
          fi
          echo "Staging CD is ready to execute the configured deployment command."
      - name: Deploy to staging
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
        run: bash -lc "$DEPLOY_COMMAND"

  cd-production:
    name: CD Production
    needs: cd-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build deployment artifact
        run: pnpm build
      - name: Validate production deployment configuration
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "DEPLOY_COMMAND is not configured for the production environment."
            exit 1
          fi
          echo "Production CD is ready to execute the configured deployment command."
      - name: Deploy to production
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
        run: bash -lc "$DEPLOY_COMMAND"
